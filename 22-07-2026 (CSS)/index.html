<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./index.css"> 
</head>

<style>


    h1{
        color: blue;
    }

    p{
        color: green;
    }

    .a{
        color: white;
        background-color: black;
    }

    #h2{
        color: rebeccapurple;
    }

    h4, h5{
        color: aqua;
    }

    /* box model */

    .box{
        width: 200px;
        padding: 20px;
        border: 3px solid blue;
        margin: 30px;
        background-color: rgb(190, 190, 79);
    }


</style>

<body>

    <h1>CSS Selectors</h1>

    <p>Element Selector</p>

    <h1 class="a">Class Selector</h1>

    <h2 id="h2">ID Selector</h2>

    <h4>Group selector</h4>
    <h5>Heading 4</h5>

    <!--  -->

    <div class="cart">
 
    <h1>Online Store</h1>

    <div class="card">

        <h2>Product Details</h2>

        <p class="info">Product: Laptop</p>
        <p id="price">Price: 50,000 </p>

        <input type="text" placeholder="Enter Coupon code">

        <br><br>

        <button>Buy Now</button>

    </div>

    <h3>Thank You for Shopping</h3>

    </div>

    <!--  -->

    <hr>

    <h1>Box Model</h1>

    <div class="box">
        CSS Box Model
    </div>

    <!--  -->

    <div class="login">

        <h2>Login</h2>

        <input type="text" placeholder="Username">

        <br><br>

        <input type="password" placeholder="Password">

        <br><br>

        <button>Login</button>

    </div>

    <!--  -->
    
</body>
</html>
