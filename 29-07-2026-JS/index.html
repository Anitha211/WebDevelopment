<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="title">DOM</h1>
    <button onclick="changeText()">Change Text</button>

    <!--  -->

    <p id="demo">Normal Text</p>
    <button onclick="changeHTML()">Change HTML</button>

    <!--  -->

    <ul id="list">
        <li id="item">Apple</li>
    </ul>

    <button onclick="addItem()">Add Item</button>
    <button onclick="removeItem()">Remove Item</button>

    <!--  -->

    <p id="msg">JavaScript DOM</p>
    <button onclick="changeStyle()">Change Style</button>

    <!--  -->

    <h2>Form Validation</h2>

    <label><b>Name: </b></label>
    <input type="text" id="name"
        placeholder="Enter your name">

        <br><br>
    <button onclick="validateForm()">Submit</button>

    <p id="error"></p>

    <!--  -->

    <h3 id="count">Button Clicked</h3>

    <button onclick="countIncrease()">Increase</button>
    <button onclick="countDecrease()">Decrease</button>

    <!--  -->

    <br>
    <br>

    <button id="btn">Click</button>

    <!--  -->

    <input type="text" id="Task" placeholder="Enter Task">
    <button id="addBtn">Add</button>

    <ul id="taskList"></ul>
    <button id="removeBtn">Remove</button>

    <br>
    <br>

    <!--  -->

    <label>User Name:</label>
    <input type="text" id="username" 
            placeholder="Username">
    <button id="loginBtn">Login</button>

    <h3 id="output"></h3>

    <!--  -->

    <h2>To-Do List</h2>

    <input type="text" id="task1" placeholder="Enter Task">
    <button id="AddBtn">ADD</button>

    <ul id="LIST"></ul>

    <!--  -->

    <br>

    <input type="number" id="amount" 
            placeholder="Withdraw amount">
    <button id="withdrawBtn">Withdraw</button>

    <h3 id="balance">Balance: 10000</h3>

    <!--  -->
    
    <h4>Password show/Hide</h4>
    <input type="password" id="password">
    <button id="toggleBtn">Show</button>

    <!--  -->

    <h2>Student Management System</h2>

    <label>Student Name: </label>
    <input id="student" placeholder="Student Name">

    <br><br>

    <label>Subject 1: </label>
    <input id="m1" placeholder="Subject 1">

    <br><br>

    <label>Subject 2: </label>
    <input id="m2" placeholder="Subject 2">

    <br><br>

    <label>Subject 3: </label>
    <input id="m3" placeholder="Subject 3">

    <br><br>

    <button id="resultBtn">Add Result</button>

    <br><br>

    <table id="resultTable" border="1" cellpadding="10" >

        <tr>
            <th>Student Name</th>
            <th>S1</th>
            <th>S2</th>
            <th>S3</th>
            <th>Total Marks</th>
            <th>Grade</th>
        </tr>

    </table>

    <script src="./index.js"></script>
    
</body>
</html>
