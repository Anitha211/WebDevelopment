<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .container{
        display: flex;
        background-color: black;
        color: white;
        gap:20px;
        margin: 30px;
        padding:30px;
        align-items: center;
        justify-content: center;
    }

    .box{
        width: 150px;
        padding: 20px;
        border: 1px solid gold;
        text-align: center;
    }

    .container1{
        display: flex;
        background-color: black;
        color: white;
        gap:20px;
        margin: 30px;
        padding:30px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    /* navbar */

    .navbar{
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: rgb(0, 0, 0);
        background-color: goldenrod;
        padding: 15px;
    }

    .menu{
        display: flex;
        gap: 20px;
        flex-direction: column;
    }

    .menu a{
        color: black;
    }

    /* 2 column layout */

    .a{
        display: flex;
        height: 100px;
        margin: 10px;
        align-content: center;
        font-weight: bold;
        background-color: lightcoral;
        gap:10px;
        padding: 10px;
    }

    .side{
        width: 250px;
        background-color: olive;
        color: black;
        padding: 20px;
    }

    .content{
        flex: 1;
        background-color: lightblue;
        padding: 20px;
        color: black;
    }

    /* Header, Content, Footer layout  */

    .page{
        display: flex;
        flex-direction: column;
        background-color: black;
        gap: 20px;
        color: white;
        padding: 10px;
        /* justify-content: center; */
    }

    .main{
        display: flex;
        gap: 5px;
        /* background-color: blue; */
        /* padding: 10px; */
        flex: 1;

    }

    aside{
        width: 200px;
        background-color: blue;
        padding: 10px;
        text-align: center;
        height: 70px;
    }

    section{
        flex: 1;
        background-color: blue;
        padding: 10px;
        text-align: center;
    }

    header, footer{
        background-color: blue;
        padding: 10px;
        text-align: center;
    }

    /* dashboard layout */

    .dashboard{
        display: flex;
        height: 50vh;
        gap: 10px;
    }

    nav{
        width: 220px;
        background-color: burlywood;
        color:white;
        padding: 20px
    }

    .Content{
        display: flex;
        flex-direction: column;
    }

    .head{
        background-color: skyblue;
        padding: 20px;
    }

    main{
        flex: 1;
        background-color: whitesmoke;
        padding: 20px;
    }


</style>

<body>

    <!-- flex direction - row & column -->

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
    </div>

     <div class="container1">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
    </div>

    <!-- Navigation Bar  -->

    <div class="navbar">
        <h2>Logo</h2>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- Two Column Layout -->

    <div class="a">
        <aside class="side">Sidebar</aside>
        <main class="content">Main Content</main>
    </div>

    <!-- Header, Content, Footer layout -->

    <div class="page">
        <header>Header</header>

        <div class="main">
            <aside>Sidebar</aside>
            <section>Content</section>
        </div>

        <footer>Footer</footer>
    </div>

    <br>
    <br>

    <!-- dashboard layouts -->

    <div class="dashboard">

        <nav>Menu</nav>

        <div class="Content">
            <header class="head">Header</header>
            <main>Main Content</main>
        </div>

    </div>

    <!--  -->

    <h1 style="text-align: center;">Flex Layout Designs</h1>

    <div class="layout1">

        <div class="header1">Header</div>

        <div class="section1">
            <div class="left1">
                <div class="hero1">HERO</div>

                <div class="sidebar1">Sidebar</div>

            </div>

            <div class="right1">
                <div class="main1">Main Content</div>

                <div class="extra1">Extra Content</div>
            </div>

        </div>

</body>

</html>
