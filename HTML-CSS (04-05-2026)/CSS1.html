<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">

</head>

<style>
    body {
        font-family: Arial, sans-serif;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: aquamarine;
        padding: 40px;
        color: aliceblue;
    }

    .logo {
        color: black;
        font-size: 20px;
        font-weight: bold;
    }

    .menu {
        display: flex;
        gap: 30px;
    }

    .menu a {
        color: aliceblue;
        font-size: 16px;
    }

    .memu a:hover {
        color: #ffffff;
    }
</style>


<body>

    <div class="navbar">
        <div class="logo">MyLogo </div>

        <div class="memu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <hr>
    <br>

    <div class="header">Header</div>

    <div class="main">

        <div class="sidebar">Sidebar</div>
        <div class="content">Main Content</div>

    </div>

</body>

</html>
