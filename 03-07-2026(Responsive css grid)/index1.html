<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    .container{
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr;
        grid-template-rows: 80px 1fr 180px 70px;
    }

    .header, 
    .article, 
    .sidebar,
    .footer{
        color: white;
        font-size: 22px;
        border-radius: 5px;
        display: grid;
        justify-content: center;
        align-items: center;
    }

    .header{
        background-color: blueviolet;
        padding: 10px;
    }

    .article{
        background-color: burlywood;
    }

    .sidebar{
        background-color: rgb(13, 124, 124);
    }

    .sidebar ul{
        margin-top: 10px;
        margin-left: 20px;
    }

    .sidebar li{
        margin-bottom: 8px;
    }

    .footer{
        background-color: rgb(207, 134, 23);
    }

    @media (min-width:768px) {
        
        .container{
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 80px 1fr 70px;
        }

        .header{
            grid-column: 1/3;
        }

        .article{
            grid-column: 1/2;
            grid-row: 2/3;
        }

        .sidebar{
            grid-column: 2/3;
            grid-row: 2/3;
        }

        .footer{
            grid-column: 1/3;
        }
    }


</style>

<body>

    <div class="container">

        <header class="header">Header</header>

        <main class="article">
            <h2>Blog Article</h2>

            <p>Welcome to my blog. These the main content section whare articles are displayed.</p>
        </main>

        <aside class="sidebar">
            <h3>Categories</h3>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>React</li>
            </ul>
        </aside>

        <footer class="footer"> Footer </footer>

    </div>

</body>

</html>
