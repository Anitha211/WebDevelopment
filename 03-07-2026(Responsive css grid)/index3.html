<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    .container{
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr;
        grid-template-rows: 80px 1fr;   
    }

    .header{
        background-color: rgb(47, 161, 214);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 28px;
    }

    .sidebar{
        background: rgb(56, 194, 56);
        color: white;
        padding: 20px;
    }

    .sidebar ul{
        margin-top: 15px;
    }

    .sidebar li{
        padding: 8px 0;
    }

    .products{
        display: grid;
        grid-template-columns: 1fr;
        gap:15px;
    }

    .card{
        background: white;
        border: 1px solid gray;
        border-radius: 8px;
        text-align: center;
        padding: 15px;
    }

    .card img{
        width: 100%;
        height: 150px;
        border-radius: 5px;
    }

    .card h3{
        margin: 15px 0;
    }

    .card p{
        color: #555;
        font-size: 18px;
    }

    .footer{
        background-color: orange;
        color: white;
        text-align: center;
        padding: 20px;
    }

    /* desktop */

    @media (min-width:768px) {
        .container{
            grid-template-columns: 220px 1fr;
            grid-template-rows: 80px 1fr 70x;
        }

        .header{
            grid-column: 1/3;
        }

        .sidebar{
            grid-column: 1/2;
            grid-row: 2/3;
        }

        .products{
            grid-column: 2/3;
            grid-template-columns: repeat(3. 1fr);
        }

        .footer{
            grid-column: 1/3;
        }
    }

</style>

<body>
    <div class="container">

        <div class="header">
            Product Dashboard
        </div>

        <div class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li>Dashboard</li>
                <li>Products</li>
                <li>Orders</li>
                <li>Customers</li>
            </ul>
        </div>

        <div class="products">

            <div class="card">
                <img src="" alt="Product 1">
                <h3>Product 1</h3>
                <p>Price: 299</p>
            </div>

            <div class="card">
                <img src="" alt="Product 2">
                <h3>Product 2</h3>
                <p>Price: 399</p>
            </div>

            <div class="card">
                <img src="" alt="Product 3">
                <h3>Product 3</h3>
                <p>Price: 459</p>
            </div>

            <div class="card">
                <img src="" alt="Product 4">
                <h3>Product 4</h3>
                <p>Price: 1000</p>
            </div>

            <div class="card">
                <img src="" alt="Product 5">
                <h3>Product 5</h3>
                <p>Price: 769</p>
            </div>

            <div class="card">
                <img src="" alt="Product 6">
                <h3>Product 6</h3>
                <p>Price: 899</p>
            </div>

        </div>

        <div class="footer">
            &copy; 2026 Product Dashboard</div>

    </div>
</body>
</html>
