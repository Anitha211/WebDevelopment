<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="./style.css">
</head>

<style>
    .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
    }

    .item {
        color: white;
        background-color: blue;
        padding: 20px;
        text-align: center;
        font-size: 20px;
    }

    /*  */

    .Container {
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: 80px 300px 60px;
        gap: 10px;
        margin-top: 20px;
    }

    .header,
    .footer {
        grid-column: 1/3;
    }

    .box {
        background-color: green;
        border: 2px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 30px;
        font-weight: bold;
    }
</style>

<body>

    <h1>Grid</h1>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>

    <!--  -->

    <div class="Container">
        <div class="box header">Header</div>
        <div class="box">Sidebar</div>
        <div class="box">Content</div>
        <div class="box footer">Footer</div>
    </div>

    <!--  -->

    <div class="grid">

        <div class="box-2"></div>
        <div class="box-1"></div>
        <div class="box-1"></div>
        <div class="box-2"></div>
        <div class="box-1"></div>
        <div class="box-1"></div>
        <div class="box-2"></div>
        <div class="box-1"></div>
        <div class="box-1"></div>
        <div class="box-1"></div>
        <div class="box-1"></div>

    </div>

</body>

</html>
