<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .container {
        display: grid;
        grid-template-columns: 250px 1fr;
        grid-template-areas:
            "header header"
            "sidebar main"
            "sidebar boxs"
            "footer footer";
        gap: 10px;
        padding: 10px;
    }

    .header {
        grid-area: header;
        background-color: #0077b6;
        color: white;
        padding: 20px;
        font-size: 24px;
        text-align: center;
    }

    .sidebar {
        grid-area: sidebar;
        background-color: #644f18;
        color: #ddd;
        padding: 20px;
        min-height: 400px;
        text-align: center;
        font-size: 22px;
    }

    .main {
        grid-area: main;
        background-color: #ffb703;
        color: #ddd;
        min-height: 180px;
        text-align: center;
        padding: 20px;
    }

    .boxs {
        grid-area: boxs;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .box {
        background-color: rgb(148, 58, 58);
        color: #ddd;
        padding: 30px;
        text-align: center;
        border: 1px solid gray;
        height: 150px;
        justify-content: center;
    }

    .footer {
        grid-area: footer;
        background-color: #023047;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        color: #ddd;
    }

    /* Responsive layout tablet */

    @media (max-width: 768px) {
        
        .container{
            grid-template-columns: 1fr;
            grid-template-areas: "header"
             "sidebar"
             "main"
             "boxs"
             "footer";
        }

        .sidebar{
            min-height: 150px;
        }

        .boxs{
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* mobile */

    @media (max-width:480px) {
        .boxs{
            grid-template-columns: 1fr;
        }

        .header{
            font-size: 24px;
        }

        .main, .sidebar, .footer{
            font-size: 18px;
        }

        .box{
            padding: 30px;
            font-size: 24px;
        }
    }

</style>

<body>

    <div class="container">

        <header class="header">
            Heading
        </header>

        <aside class="sidebar">Sidebar</aside>

        <main class="main"> Main Content </main>

        <div class="boxs">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
        </div>

        <footer class="footer">FOOTER</footer>
    </div>

</body>

</html>
