<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML TABLE</title>
</head>
<body>
    <!-- Tables -->
    <h1>Tables - are used to display data in rows and columns </h1>

    <table border="1" cellpadding="10", cellspacing="0">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Class</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <td>Anitha</td>
            <td>12</td>
            <td>7 class</td>
            <td>80</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>12</td>
            <td>7 class</td>
            <td>90</td>
        </tr>

    </table>

<hr>


    <h3>Class Time Table</h3>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>

        <tr>
            <td rowspan="2">Monday</td>
            <td>Math</td>
            <td>Science</td>
            <td>English</td>
        </tr>

        <tr>
            <td colspan="3">Lab Session</td>
        </tr>

        <tr>
            <td rowspan="2">Tuesday</td>
            <td>English</td>
            <td>Math</td>
            <td>Science</td>
        </tr>

        <tr>
            <td colspan="3">Sports</td>
        </tr>
    </table>




    
</body>
</html>
