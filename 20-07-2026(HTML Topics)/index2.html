<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Job Application Portal</h1>

    <form>

        <label><b>Name: </b></label>
        <input type="text" placeholder="Enter your name">

        <br><br>

        <label><b>Email: </b></label>
        <input type="email" placeholder="Enter Ypur Email ">

        <br><br>

        <label><b>Phone: </b></label>
        <input type="tel" placeholder="Enter number">

        <br><br>

        <label><b>Position:</b></label>
        <select>
            <option>React Developer</option>
            <option>Java Developer</option>
            <option>Python Developer</option>
            <option>UI/UX Designer</option>
            <option>Full Stack Developer</option>
        </select>

        <br><br>

        <label><b>Experience:</b></label>
        <select>
            <option>Fresher</option>
            <option>1 Year</option>
            <option>2 Years</option>
            <option>3 Years</option>
            <option>4 Years</option>
            <option>5+ Years</option>
        </select>

        <br><br>

        <label><b>Skills:</b></label>

        <br>

        <input type="checkbox">
        <label>HTML</label>

        <input type="checkbox">
        <label>CSS</label>

        <input type="checkbox">
        <label>JavaScript</label>

        <input type="checkbox">
        <label>React</label>

        <br><br>

        <label><b>Upload Resume:</b></label>
        <input type="file">

        <br><br>

        <label><b>Cover Letter:</b></label>
        <textarea row="5" cols="35" placeholder="Write about yourself..."></textarea>

        <br><br>

        <label><b>Preferred work mode:</b></label>

        <br><br>

        <input type="radio" name="mode">
        <label>Work From Office</label>

        <input type="radio" name="mode">
        <label>Hybrid</label>

        <input type="radio" name="mode">
        <label>Remote</label>

        <br><br>

        <input type="checkbox">
        <label>I confirm that the above information is correct.</label>

        <br><br>

        <button type="submit">Submit Application</button>

        <button type="reset">Reset</button>



    </form>

</body>
</html>
