<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Online Shopping</h1>

    <img src="" alt="image">

    <h2>Wireless Bluetooth Headphones</h2>

    <p><b>Price: </b> 2999</p>

    <p>Noise Cancellation. long lift battery, and comfortable design</p>

    <label><b>Select Size: </b></label>
    <select>
        <option>Standard</option>
        <option>Small</option>
        <option>Large</option>
    </select>

    <br><br>

    <label><b>Quantity: </b></label>
    <input type="number" value="1" min="1" max="10">

    <br><br>

    <button>Add to Cart</button>

    <br><hr><br>

    <!-- sematic tags -->

    <header>
        <h1>Food Corner</h1>
    </header>

    <nav>
        <a href="">Home</a>
        <a href="">Menu</a>
        <a href="">Offers</a>
    </nav>

    <main>

        <section>

            <article>
                <h2>Veg Pizza</h2>
                <p>Price: 299</p>
            </article>

            <article>
                <h2>Burger</h2>
                <p>Price: 149</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Contact: foodcorner@gmail.com</p>
    </footer>

    <!--  -->
    <br><hr><br>

    <h1>Feedback Form</h1>

    <form>
        <label>Name: </label>
        <input type="text">

        <br><br>

        <label>Rating: </label>

        <input type="radio" name="rating">1
        <input type="radio" name="rating">2
        <input type="radio" name="rating">3

        <br><br>

        <label>Suggestions: </label>

        <br>

        <textarea rows="5" cols="30"></textarea>

        <br><br>

        <input type="checkbox">
        Accept Terms

        <br><br>

        <button>Send</button>
    </form>


</body>
</html>
