<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Login Form Validation</h1>

    <input type="text" id="username" placeholder="Enter Username" />
    <button onclick="validateUser()">Login</button>

    <p id="message"></p>

    <hr>

    <h1>Todo List</h1>

    <input type="text" id="task">
    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>

    <hr>

    <h1>Hide/show Password</h1>

    <input type="password" id="password">
    <button onclick="togglePassword()">Show</button>

    <hr>

    <h2>Cart: <span id="cart">0</span></h2>

    <button onclick="addItem()">Add Item</button>

    <hr>

    <h2>Count: <span id="count">0</span></h2>
    <button onclick="increase()">Click Here</button>

    <hr>

    <h1>Age Checker</h1>

    <input type="number" id="age">
    <button onclick="checkAge()">Check</button>

    <p id="output"></p>

    <hr>

    <h1>API User List</h1>

    <button onclick="getUsers()">Load Users</button>

    <ul id="users"></ul>

    <hr>

    <h1>Student Attendance Tracker</h1>

    <h2>Present: <span id="Count">0</span></h2>
    <button onclick="markPresent()">Mark Present</button>

    <hr>

    <h1>Quiz</h1>

    <p>2 + 2 = ?</p>

    <input id="answer">

    <button onclick="checkAnswer()">Submit</button>

    <h3 id="Result"></h3>

    <hr>

    <h1>ATM Machine</h1>

    <h2 id="balance">Balance: 1000</h2>

    <input id="amount" type="number">

    <button id="deposit">Deposit</button>

    <button id="withdraw">Withdraw</button>

    <hr>

    <h1>Registration Form</h1>

    <form id="registrationForm">

        <label>Name: </label>
        <input type="text" placeholder="Enter Your Name" id="name">

        <br><br>

        <label>Email: </label>
        <input type="email" placeholder="Enter Email" id="email">

        <br><br>

        <label>Password: </label>
        <input type="password" placeholder="Enter Password" id="password">

        <br><br>

        <button type="submit">Submit</button>

    </form>

    <h2 id="Message"></h2>

    <hr>

    

    <script src="./index.js"></script>

</body>

</html>
