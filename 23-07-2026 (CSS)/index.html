<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    .container{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        background-color: aqua;
        gap: 10px;
        padding: 20px;
        width: 50%;
        text-align: center;
    }

    .box{
        background-color: lightblue;
        padding: 10px;
    }

    /*  */

    .container1{
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: 80px 300px 60px;
        gap: 10px; 
        margin-top: 20px;
        width: 53%;
        font-size: 20px;
        font-weight: bold;
    }

    .header{
        grid-column: 1/3;
        background-color: lightblue;
        display: grid;
        justify-content: center;
        align-items: center;
    }

    .sidebar{
        background-color: lightgreen;
         display: grid;
        justify-content: center;
        align-items: center;
    }

    .content{
        background-color: rgb(179, 179, 78);
         display: grid;
        justify-content: center;
        align-items: center;
    }

    .footer{
        grid-column: 1/3;
        background-color: pink;
         display: grid;
        justify-content: center;
        align-items: center;
        
    }

    /*  */

    .container2{
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: 70px 80px 300px 70px;
        margin-top: 20px;
        gap: 10px;
        width: 50%;
        background-color: black;
        padding: 40px;
    }

    .logo{
        background-color: orange;
        text-align: center;
        padding: 20px;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    .nav{
        background-color: lightgreen;
        text-align: center;
        padding: 20px;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    .head{
        background-color: skyblue;
        grid-column: 1/3;
        padding: 25px;
        text-align: center;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    .side{
        background-color: pink;
        text-align: center;
        padding: 120px 20px;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    .body{
        background-color: lightgray;
        text-align: center;
        padding: 120px 20px;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    .foot{
        background-color: yellow;
        grid-column: 1/3;
        padding: 25px;
        text-align: center;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

</style>

<body>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

    <!--  -->

    <div class="container1">

        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>
        <div class="footer">Footer</div>

    </div>

    <!--  -->

    <div class="container2">
     
            <div class="logo">Logo</div>
            <div class="nav">Navigation</div>
            <div class="head">Header/Banner</div>
            
            <div class="side">Side Bar</div>
            <div class="body">Body Area</div>
            
            <div class="foot">Footer</div>
    </div>

</body>
</html>
