<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>Shopyy</h2>

            <input type="search" placeholder="Search product">
            <button>Login</button>
        </div>

        <!-- sidebar -->

        <div class="sidebar">

            <h3>Categories</h3>

            <ul>
                <li>Mobiles</li>
                <li>Laptops</li>
                <li>Fashion</li>
                <li>Shoes</li>
                <li>Watches</li>
                <li>Electronics</li>
            </ul>

        </div>

        <div class="products">

            <div class="card">
                <img src="" alt="product1">
                <h3>Laptop</h3>
                <p>Intel i5 | 16GB RAM</p>
                <h2 class="peice">55,999</h2>
                <p class="rating">4</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="" alt="product1">
                <h3>Smart Phone</h3>
                <p>8GB RAM | 128GB Storage</p>
                <h2 class="peice">24,999</h2>
                <p class="rating">5</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="" alt="product1">
                <h3>Smart Watch</h3>
                <p>Blutooth calling</p>
                <h2 class="peice">4,999</h2>
                <p class="rating">4</p>
                <button>Add to Cart</button>
            </div>

        </div>

        <div class="footer">
            &copy; 2026 Shopyy | All Rights Reserved
        </div>

    </div>

</body>

</html>
