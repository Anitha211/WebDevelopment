<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    .container{
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: 70px 100px auto 60px;
        gap: 15px;
        width: 50%;
    }

    .header{
        background-color: blue;
        grid-column: 1/3;
        display: grid;
        place-items: center;
        font-size: 28px;
        border-radius: 10px;
    }

    .sidebar{
        background-color: lightgreen;
        grid-row: 2/4;
        display: grid;
        place-items: center;
        font-size: 28px;
        border-radius: 10px;
    }

    .main{
        background-color: orange;
        display: grid;
        place-items: center;
        font-size: 28px;
        border-radius: 10px;
    }

    .boxs{
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .box{
        background-color: rgb(161, 111, 45);
        display: grid;
        place-items: center;
        font-size: 28px;
        border-radius: 10px;
        height: 160px;
    }

    .footer{
        background-color: grey;
        grid-column: 1/3;
        display: grid;
        place-items: center;
        font-size: 28px;
        border-radius: 10px;
    }

    /* tablet */

    @media (max-width: 786px) {
        .container{
            grid-template-columns: 1fr;
            grid-template-rows: auto;
        }

        .header,
        .footer{
            grid-column: 1;
        }

        .sidebar{
            grid-row: auto;
        }

        .boxs{
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* mobile */

    @media (max-width: 480px) {
        
        .boxs{
            grid-template-columns: 1fr;
        }
    }
     
</style>

<body>

    <div class="container">

        <header class="header">
            Heading
        </header>

        <aside class="sidebar">Sidebar</aside>

        <main class="main"> Main Content </main>

        <div class="boxs">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
        </div>

        <footer class="footer">Footer</footer>
    </div>

</body>
</html>
