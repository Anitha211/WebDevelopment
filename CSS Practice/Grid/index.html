<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
    
</head>
<style>
    .container{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
    }

    .box{
        background-color: lightblue;
        padding: 20px;
        text-align: center;
    }

    
</style>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
      
    <br><br><hr><br><br>

     <div style=" width: 500px; height:700px ;background-color:rgb(235, 241, 241); display: grid;" id="b">
        
        <div class="header">Header</div>

        <div class="bar">Side Bar</div>

        <div class="nav">Navigation</div>

        <div class="footer">Footer</div>

    
    </div>
</body>
</html>
