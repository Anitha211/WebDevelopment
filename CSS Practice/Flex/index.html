<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex(Product Card)</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <h1 style="text-align: center; padding: 20px;">Shopping Cart</h1>
    <div class="container">

        <div class="card">
            <img src="" alt="product">
            <h3>Headphones</h3>
            <p>&#8377 999</p>
            <button class="btn">Add to Card</button>
        </div>

        <div class="card">
            <img src="./Shoes.jpeg" alt="Product">
            <h3>Shoes</h3>
            <p>&#8377 1999</p>
            <button class="btn">Add to Card</button>
        </div>

        <div class="card">
            <img src="./Smart Image.avif" alt="Product">
            <h3>Watch</h3>
            <p>&#8377 1499</p>
            <button class="btn">Add to Card</button>
        </div>

        <div class="card">
            <img src="./backpack.jpg" alt="Product">
            <h3>Backpack</h3>
            <p>&#8377 899</p>
            <button class="btn">Add to Card</button>
        </div>
    </div>

</body>
</html>
