<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

   *{
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
   }

   .container{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap:20px;
    align-items: center;
   }

   .card{
    background: white;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
    border: 1px solid blue;
   }

   .card img{
    width: 100%;
    border-radius: 8px;
   }

   .card p{
    font-size: 18px;
    color:green
   }


.btn{
    background: rgb(77, 77, 231);
    color: white;
    padding: 10px;
    cursor: pointer;
    width:100%
}

.btn:hover{
    background: darkblue;
}

@media(max-width:786px){
    .container{
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width:460px){
    .container{
        grid-template-columns: 1fr;
    }
}
</style>
<body>
       <h1 style="text-align: center; padding: 20px;">Shopping Cart</h1>
       <div class="container">

       <div class="card">
            <img src="" alt="product">
            <h3>Headphones</h3>
            <p>&#8377 999</p>
            <button class="btn">Add to Card</button>
        </div>

        <div class="card">
            <img src="./Shoes.jpeg" alt="Product">
            <h3>Shoes</h3>
            <p>&#8377 1999</p>
            <button class="btn">Add to Card</button>
        </div>

        <div class="card">
            <img src="./Smart Image.avif" alt="Product">
            <h3>Watch</h3>
            <p>&#8377 1499</p>
            <button class="btn">Add to Card</button>
        </div>

        <div class="card">
            <img src="./backpack.jpg" alt="Product">
            <h3>Backpack</h3>
            <p>&#8377 899</p>
            <button class="btn">Add to Card</button>
        </div>

         <div class="card">
            <img src="./backpack.jpg" alt="Product">
            <h3>Laptop</h3>
            <p>&#8377 899</p>
            <button class="btn">Add to Card</button>
        </div>

        <div class="card">
            <img src="./backpack.jpg" alt="Product">
            <h3>Bottels</h3>
            <p>&#8377 899</p>
            <button class="btn">Add to Card</button>
        </div>

    </div>

</body>
</html>
