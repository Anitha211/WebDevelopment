<!DOCTYPE html>
<html lang="en">

<head>

    <title>Event Handling</title>
</head>

<body>
    <h1>Event Capturing</h1>

    <div id="parent">
        <button id="child">
            Click Here
        </button>
    </div>

    <br>
    <!--  -->
    <br>
    
    <div id="Grandparent">
        <div id="Parent">
            <button id="Child">Click</button>
        </div>
    </div>
        <h3>Output:</h3>
        <p id="output"></p>

    <!--  -->
        <br>
        <br>

        <div id="outer">
            <div id="inner">
                <button id="button">Capturing</button>
            </div>
        </div>

    <!-- event bubbling -->

     <h1>Event Bubbling</h1>

     <div id="GRANDPARENT">
        <div id="PARENT">
            <button id="CHILD">Event Bubblling</button>
        </div>
    </div>

    <h3>Output:</h3>
    <p id="result"></p>
    
    <!--  -->

    <div id="card">
        <button id="btn">Buy Now</button>
    </div>
    <br>
    <br>

    <!-- bubbling Vs capturing -->

    <div id="P">
        <button id="C">CLICK HERE</button>
    </div>
    <h3>Output : </h3>
    <p id="Result"></p> 

    <br>
   

    <div id="productlist">
        <h3>Products:-</h3>
        <P class="product">Mobile</P>
        <P class="product" >Laptop</P>
        <p class="product" >Headphones</p>
    </div>

    <br>
