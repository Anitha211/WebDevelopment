<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
</head>

<style>
    *{
        font-family: 'Times New Roman', Times, serif;
        /* Universal Selector */
    }

    h1{
        color: rgb(3, 3, 212);
        /* Element selector */
    }

    #title{
        background-color: yellow;
        padding: 20px;
        /* ID Selector */
    }

    .info{
        color: green;
        /* class selector */
    }

    h2, h3{
        color: purple;
        /* Group Selector */
    }

    .container p{
        border: 1px solid black;
        /* Descendent Selector */
    }

    .box > p{
        background-color: lightblue;
        /* Clild Selector */
    }

    h2 + p{
        color: red;
        /* Adjacent Sibling Selector */
    }
    
    h3 ~ p {
        font-style: italic;
        /* Genernal sibling selector */
    }

    input[type]{
        border: 5px solid rgb(235, 42, 74);
        padding: 20px;
        /* Attribut selector */
    }

    input[type="text"]{
        background-color: lightpink;
        /* Attribute value selector */
    }

    input[type="password"]{
        background-color: lightgreen;
    }

    button:hover{
        background-color: orange;
        /* Hover Pseudo selector */
    }

    input:focus{
        background-color: rgb(206, 137, 109);
        /* focus */
    }

    li:first-child{
        color: rgb(207, 40, 11);
        font-size: larger;
        /* first child */
    }

    li:last-child{
        color: rgb(98, 98, 240);
    }

    li:nth-child(2){
        color: deeppink;
    }

    .para::first-letter{
        font-size: 30px;
        color: red;
    }

    h1::before{
        content: "📌";
    }

    h1::after{
        content: "📖";
    }

</style>

<body>

    <h1 id="title">CSS Selectors</h1>

    <h2>Heading 2</h2>
    <p>This is a Adjacent Sibling Paragraph</p>

    <div class="container">

        <p class="info">
            Paragraph inside a container
        </p>

        <div class="box">
            <p> Child Selector </p>
            
            <section>
                <p> Descendant Selector </p>
            </section>
            
        </div>

    </div>

    <h3>Heading 3</h3>

    <p>Sibling Para 1</p>
    <p>Sibling Para 2</p>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <input type="text" placeholder="Enter Name">

    <br><br>

    <input type="password" placeholder="Enter password">

    <br><br>

    <button>Click Here</button>

    <p class="para">
        CSS Selectors is used to identify and target the HTML Elements.
    </p>

</body>

</html>
