<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table {
        width: 80%;
        border-collapse: collapse;
        text-align: center;
    }

    th,
    td {
        border: 1px solid black;
        padding: 10px;
    }

    th {
        background-color: antiquewhite;
    }

    .lunch {
        background-color: #f3cd5b;
        font-weight: bold;
    }
</style>

<body>
    <h2>School Weekly Timetable</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Day</th>
                <th>Period 1</th>
                <th>Period 2</th>
                <th>Period 3</th>
                <th>Period 4</th>
                <th>Period 5</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Monday</td>
                <td>Math</td>
                <td>Science</td>
                <td class="lunch" colspan="2">Lunch Break</td>
                <td>English</td>
            </tr>

            <tr>
                <td>Tuesday</td>
                <td>English</td>
                <td>Telugu</td>
                <td class="lunch" colspan="2">Lunch Break</td>
                <td>Math</td>
            </tr>

            <tr>
                <td>Wednesday</td>
                <td>Science</td>
                <td>Math</td>
                <td class="lunch" colspan="2">Lunch Break</td>
                <td>English</td>
            </tr>

            <tr>
                <td>Thurday</td>
                <td>Math</td>
                <td>Science</td>
                <td class="lunch" colspan="2">Lunch Break</td>
                <td>English</td>
            </tr>

            <tr>
                <td>Friday</td>
                <td>Math</td>
                <td>Science</td>
                <td class="lunch" colspan="2">Lunch Break</td>
                <td>Sports</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
