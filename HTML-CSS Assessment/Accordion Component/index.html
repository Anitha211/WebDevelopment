<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        font-family:Arial, Helvetica, sans-serif;
        background-color: white;
        /* display: flex; */
        /* justify-content: center; */
        padding-top: 50px;
    }

    .accordion{
        width: 500px;
    }

    .item{
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        /* overflow: hidden; */
    }

    .title{
        width: 100%;
        padding: 15px;
        border: none;
        background-color: #333;
        color: white;
        font-size: 18px;
        text-align: left;
        cursor: pointer;
    }

    .content{
        max-height: 0;
        overflow: hidden;
        background-color: white;
        transition: max-height 0.5s ease;
    }

    .content p {
        padding: 15px;
    }
</style>
<body>

    <div class="accordion">

        <div class="item">
            <button class="title">Section 1</button>
            <div class="content">
                <p>This is content for section 1.</p>
            </div>
        </div>

        <div class="item">
            <button class="title">Section 2</button>
            <div class="content">
                <p>This is content for section 2.</p>
            </div>
        </div>

        <div class="item">
            <button class="title">Section 3</button>
            <div class="content">
                <p>This is content for section 3.</p>
            </div>
        </div>

        <div class="item">
            <button class="title">Section 4</button>
            <div class="content">
                <p>This is content for section 4.</p>
            </div>
        </div>

    </div>

    <script>
        let titles = document.querySelectorAll(".title");

titles.forEach((title) => {
    title.addEventListener("click", () => {
        let content = title.nextElementSibling;

        document.querySelectorAll(".content").forEach((item) => {

            if(item !== content) {
                item.style.display = "none";
            }
        });

        if(content.style.display === "block") {
            content.style.display ="none"
         } else {
            content.style.display = "block"
        }
    })
})
    </script>
    
</body>
</html>
