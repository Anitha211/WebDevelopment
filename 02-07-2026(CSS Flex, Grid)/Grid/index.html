<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
</head>

<style>

.container{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 100px 100px;
    gap:15px;
}

.item{
    background-color: lightblue;
    border: 2px solid blue;
    display: flex;
    align-items:center ;
    justify-content: center;
    font-size: 25px;
    color: white;
    font-weight: bold;
}

/*  */

.container1{
    display: grid;
    gap: 5px;
    grid-template-rows: 80px 250px 80px;
    margin-top: 20px ;
    background-color: black;
    padding: 5px;
}

header,footer{
    display: grid;
    align-items: center;
    color: white;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

header{
    background-color: rgb(94, 169, 199);
}

.sidebar{
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 5px;
}

aside{
    background-color: lightcoral;
    display: grid;
    align-items: center;
    color: white;
    justify-content: center;
    
}

main{
    background-color: green;
    display: grid;
    align-items: center;
    justify-content: center;
    color: white;
}

footer{
    background-color: grey;
}

/*  */

.container2{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.box{
    background-color: rgb(148, 7, 148);
    padding: 40px;
    text-align: center;
    color: white;
}

.box1{
    grid-column: span 2;
}

/*  */

.calculator{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
}

.display{
    grid-column: span 4;
    background: black;
    color: white;
    padding: 20px;
    text-align: right;
    font-size: 24px;
    border-radius: 30px;
}

.a{
    background-color: rgb(77, 168, 204);
    color: white;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    border-radius: 30px;
}

</style>

<body>

    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
    
    <!--  -->

    <div class="container1">
        <header>Header</header>

        <div class="sidebar">
            <aside>Sidebar</aside>
             <main>Content</main>
        </div>

        <footer>Footer</footer>

    </div>

    <!--  -->

    <div class="container2">

        <div class="box box1">1</div>
        <div class="box">2</div>
        <div class="box">3</div>

    </div>

    <!--  -->
    <br><br>

    <div class="calculator">

        <div class="display">0</div>

        <div class="a">7</div>
        <div class="a">8</div>
        <div class="a">9</div>
        <div class="a">+</div>

        <div class="a">6</div>
        <div class="a">5</div>
        <div class="a">4</div>
        <div class="a">*</div>

        <div class="a">3</div>
        <div class="a">2</div>
        <div class="a">1</div>
        <div class="a">-</div>

        <div class="a">+</div>
        <div class="a">=</div>
        <div class="a">.</div>
        <div class="a">0</div>

    </div>

    <!--  -->

    

</body>
</html>
