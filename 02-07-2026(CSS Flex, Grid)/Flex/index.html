<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
</head>
<style>
    .boxcontainer {
        display: flex;
        background-color: black;
        color: white;
        gap: 20px;
        margin: 30px;
        padding: 30px;
        align-items: center;
        justify-content: center;
    }

    .box {
        width: 150px;
        padding: 20px;
        border: 1px solid gold;
        text-align: center;
    }

    @media (max-width: 779px) {
        .boxcontainer{
            flex-direction: column;
        }
    }

    /*  */

    .navbar{
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: gray;
        color: white;
        padding: 15px;
    }

    .menu{
        display: flex;
        gap:20px
    }

    @media (max-width:768px) {
        .navbar{
            flex-direction: column;
        }

        .menu{
            flex-direction: column;
            margin-top: 10px
        }
    }

    /*  */


</style>
<body>

    <div class="boxcontainer">
        <div class="box">BOX 1</div>
        <div class="box">BOX 2</div>
        <div class="box">BOX 3</div>
        <div class="box">BOX 4</div>
    </div>

    <hr>

    <!--  -->

    <div class="navbar">
        <h2>MyLogo</h2>

        <div class="menu">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </div>
    </div>

    <br><br>
    <hr>
    <br><br>

    <!--  -->

    <header class="nav">
        <div class="logo">ShopNow</div>

        <input type="text" placeholder="Search Products">

        <div class="menu">
            <a href="#">Login</a>
            <a href="#">Wishlist</a>
            <a href="#">Cart</a>
        </div>
    </header>

   <section class="products">

    <div class="card">
        <h3>Product 1</h3>
        <p>Price: 999</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Product 2</h3>
        <p>Price: 999</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Product 3</h3>
        <p>Price: 999</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Product 4</h3>
        <p>Price: 999</p>
        <button>Buy Now</button>
    </div>

   </section>

   <footer> &copy; 2026 ShopNow </footer>

   <!--  -->


   

</body>

</html>
